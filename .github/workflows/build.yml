name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # tag: optional manual "attach binaries to this release" escape hatch —
  # dispatch with a tag to (re)run the build and attach its assets without
  # waiting for release-please or a real tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach binaries to (optional)"
        required: false
        type: string
        default: ""
  # Called by release-please.yml right after it creates a release: tags pushed
  # by release-please-action's GITHUB_TOKEN don't trigger the `tags: ["v*"]`
  # push trigger above (GitHub suppresses workflow-triggering pushes made with
  # the default token, to avoid recursive runs) — so release-please.yml calls
  # this workflow explicitly instead, passing the tag it just created.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach binaries to"
        required: false
        type: string
        default: ""

# contents: publish the GitHub Release. actions: SignPath downloads the build
# artifact. id-token: SignPath origin-verifies the build via GitHub OIDC.
permissions:
  contents: write
  actions: read
  id-token: write

# --- Optional Windows code signing (SignPath, free for OSS) -------------------
# OFF until configured — the signing step is skipped and the Windows binary ships
# unsigned. To enable:
#   1. Apply to the SignPath Foundation (free OSS) at https://signpath.org/apply.
#   2. Install the SignPath GitHub App on this repository.
#   3. On signpath.io create a Project (linked to this repo, trusted build system
#      "GitHub.com") + an Artifact Configuration (sign timetracker-windows.exe) +
#      a Signing Policy.
#   4. Add repo Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#      SIGNPATH_SIGNING_POLICY_SLUG; and a repo Secret: SIGNPATH_API_TOKEN.
# Once those exist, tag builds sign the Windows .exe before attaching it.

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: timetracker
            asset: timetracker-linux
            artifact: timetracker-linux
          - os: macos-latest
            bin: timetracker
            asset: FableTime-macos.zip
            artifact: timetracker-macos
          - os: windows-latest
            bin: timetracker.exe
            asset: timetracker-windows.exe
            artifact: timetracker-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev \
            libvulkan-dev libgl1-mesa-dev \
            libssl-dev libzstd-dev \
            pkg-config cmake clang

      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      # macOS ships as a FableTime.app bundle (icon + Dock/Finder presence),
      # zipped with ditto so the bundle structure survives. Others ship the
      # bare binary.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            bash scripts/bundle-macos.sh "target/release/${{ matrix.bin }}" dist
            ditto -c -k --keepParent dist/FableTime.app "dist/${{ matrix.asset }}"
            rm -rf dist/FableTime.app
          else
            cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      # Sign the Windows binary if SignPath is configured (repo vars present).
      - name: Sign Windows binary (SignPath)
        id: sign
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Use signed Windows binary
        if: steps.sign.outcome == 'success'
        shell: bash
        run: cp "dist-signed/${{ matrix.asset }}" "dist/${{ matrix.asset }}"

      # On a v* tag (direct push, or called from release-please.yml with the
      # tag it just created), attach the (signed, if applicable) binary to
      # that GitHub Release. Each matrix job appends its own platform; body is
      # left alone (release-please's own per-version notes), not overwritten
      # with the full CHANGELOG.md.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true

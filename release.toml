# cargo-release config — https://github.com/crate-ci/cargo-release
# One-time install:  cargo install cargo-release
# Cut a release:     cargo release patch   (or minor / major)
#   → bumps Cargo.toml, rewrites the CHANGELOG "Unreleased" section, commits,
#     tags vX.Y.Z, and pushes. CI (.github/workflows/build.yml, on tags: v*)
#     then builds the binaries and publishes the GitHub Release.

# This is a desktop app, not a crates.io library — never publish.
publish = false

# Match the existing tags (v0.1.2, v0.2.0) so the CI `tags: ["v*"]` trigger fires.
tag-name = "v{{version}}"
tag-message = "release: v{{version}}"
pre-release-commit-message = "release: v{{version}}"

# Push the release commit + tag so CI picks it up.
push = true

# Keep the curated CHANGELOG: only move the "Unreleased" heading down under the
# new version + date, and maintain the bottom compare/tag links. Fill the notes
# under "Unreleased" by hand before releasing (as the changelog has always been).
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] — {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: (.*)/compare/(.*)\\.\\.\\.HEAD", replace = "[Unreleased]: ${1}/compare/v{{version}}...HEAD\n[{{version}}]: ${1}/releases/tag/v{{version}}", exactly = 1 },
]
